[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policyglass"
version = "0.1.0"
description = "Exact PPO/SAC learning traces, controlled branches and spatial dynamics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "numpy==2.2.6", "gymnasium==1.2.2",
  "safetensors==0.6.2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "filelock>=3.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
policyglass = "policyglass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scientific: independent numerical/physical verification"]

[tool.ruff]
line-length = 100

